services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: networkdocs
      POSTGRES_USER: networkdocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networkdocs"]
      interval: 5s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://networkdocs:${POSTGRES_PASSWORD}@db:5432/networkdocs
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
volumes:
  db_data:
